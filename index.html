    <!-- Language redirect (only on default-English URLs, only on first visit, only for fr/ar speakers) -->
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          // Don't redirect if we're already on a /fr or /ar path
          if (/^\/(fr|ar)(\/|$)/.test(path)) return;
          // Don't redirect if user previously chose a language (we store the choice on every visit)
          var stored = window.localStorage.getItem('lc_lang');
          if (stored === 'en') return; // user explicitly chose English
          var preferred = null;
          if (stored === 'fr' || stored === 'ar') {
            preferred = stored;
          } else {
            var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
            for (var i = 0; i < langs.length; i++) {
              var code = (langs[i] || '').toLowerCase().split('-')[0];
              if (code === 'ar' || code === 'fr') { preferred = code; break; }
              if (code === 'en') break;
            }
          }
          if (preferred) {
            var target = '/' + preferred + (path === '/' ? '' : path) + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
